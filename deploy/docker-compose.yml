# ==============================================================================
# ThreadFlow ERP - Docker Compose Multi-Container Orchestration
# 100% Docker-Based Architecture (Zero Local Host Dependency Law)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Enterprise Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: threadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threadflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-threadflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ThreadFlowDevSecure2026!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threadflow_admin} -d ${POSTGRES_DB:-threadflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 2. Redis 7.2 High-Throughput Cache & Distributed Lock
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: threadflow-redis
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:-RedisDevSecure2026!}",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "volatile-lru"
    ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisDevSecure2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 3. Keycloak 24 Enterprise Identity Provider (OIDC / OAuth 2.0)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: threadflow-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-KeycloakAdmin2026!}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/threadflow_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-threadflow_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ThreadFlowDevSecure2026!}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/threadflow-realm.json:/opt/keycloak/data/import/threadflow-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 4. MinIO S3-Compatible Enterprise Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: threadflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioAdmin2026!}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 5. Mailpit (Local SMTP Mock for Notifications & Invitations)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: threadflow-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 6. Backend API (ASP.NET Core 10 / .NET 10 WebApi Container)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../
      dockerfile: deploy/docker/backend/Dockerfile.dev
    container_name: threadflow-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-threadflow_db};Username=${POSTGRES_USER:-threadflow_admin};Password=${POSTGRES_PASSWORD:-ThreadFlowDevSecure2026!}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-RedisDevSecure2026!}"
      Keycloak__Authority: "http://keycloak:8080/realms/threadflow"
      Keycloak__Audience: "threadflow-api"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "${MINIO_ROOT_USER:-minio_admin}"
      MinIO__SecretKey: "${MINIO_ROOT_PASSWORD:-MinioAdmin2026!}"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threadflow-net

  # ----------------------------------------------------------------------------
  # 7. Frontend Web SPA (React 19 + TypeScript + Vite Container)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../apps/web
      dockerfile: ../../deploy/docker/frontend/Dockerfile.dev
    container_name: threadflow-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: threadflow
      VITE_KEYCLOAK_CLIENT_ID: threadflow-web
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - threadflow-net

# ------------------------------------------------------------------------------
# Persistent Volume Stores (Local Disk Isolation)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  keycloak_data:
    driver: local
  minio_data:
    driver: local
  mailpit_data:
    driver: local

# ------------------------------------------------------------------------------
# Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  threadflow-net:
    driver: bridge
